<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRODUCT CARD ASSIGNMENT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="card">
  <div class="leftside">    
    <img src="./earbud.png"
 alt="airpods">
  </div><div class="rightside">
    <div class="top">
      <div class="brand">AURA</div>
      <div class="badge">NEW • 20% OFF</div>
    </div>

    <h1>PulseBuds 2 • Wireless Earbuds</h1>
    

    <div class="prices">
      <div class="new">$49.99</div>
      <div class="old">$62.99</div>
    </div>
    <div class="save">Save 20% — $13 off</div>

    <div class="features">
      <div class="battery"><i class="fa-solid fa-battery-full"></i> 24h Battery</div>
      <div class=" resistance"><i class="fa-solid fa-ribbon"></i> IP54 Water-Resistant</div>
      <div class="bluetooth"><i class="fa-brands fa-bluetooth"></i>Bluetooth 5.3</div>
    </div>

    <div class="colors">
      <p>COLORS</p>
      <div class="dotlavendar"></div>
      <div class="dotmint"></div>
      <div class="dotpeach"></div>
    </div>
    
    <p class="comfortable">Active Noise Cancellation •  Low-Latency Mode • Comfortable In-Ear Fit</p>
    <button class="btn">Add to Cart</button>
    <div class="policy">
        <i class="fa-solid fa-check"></i>30-day returns <i class="fa-solid fa-circle"></i>1-year warranty   <i class="fa-solid fa-check"></i>Secure checkout </div>
  </div>
</div>

</body>
</html>
